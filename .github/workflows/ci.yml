name: rtdata SDK CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and compatibility tests
        run: |
          python -m pip install '.[market-time]'
          python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify wheel installation
        run: |
          EXPECTED_VERSION="$(python -c 'from rtdata._version import __version__; print(__version__)')"
          WHEEL="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "${WHEEL}"
          python -m venv /tmp/rtdata-wheel-test
          /tmp/rtdata-wheel-test/bin/pip install "${WHEEL}"
          cd /tmp
          /tmp/rtdata-wheel-test/bin/python - "${EXPECTED_VERSION}" <<'PY'
          import inspect
          from pathlib import Path
          import sys

          import rtdata
          from rtdata._history_v2_codec import zstd_available
          from rtdata._history_v2_stream import HistoryV2RequestState

          assert rtdata.__version__ == sys.argv[1]
          assert Path(rtdata.__file__).is_relative_to(Path(sys.prefix))
          for factory in (rtdata.RtdataClient, rtdata.API):
              assert inspect.signature(factory).parameters['realtime_protocol'].default == 'auto'
              assert all(p.kind != inspect.Parameter.VAR_KEYWORD
                         for p in inspect.signature(factory).parameters.values())
              assert inspect.signature(factory).parameters['history_v2_advertise'].default is True
              assert inspect.signature(factory).parameters['history_v2_default'].default is True
          assert zstd_available()
          assert HistoryV2RequestState is not None
          print(f"verified rtdata {rtdata.__version__} with History V2")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rtdata-dist
          path: dist/*
