[project]
name = "rtdata"
dynamic = ["version"]
description = "实时行情数据 SDK - 连接 Cloud Gateway 透传网关"
requires-python = ">=3.9"
dependencies = ["zstandard>=0.23,<1"]

[project.optional-dependencies]
# Retained for existing installation commands; V2 is included by default.
history-v2 = []
market-time = ["tzdata>=2025.2"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rtdata*"]

[tool.setuptools.dynamic]
version = {attr = "rtdata._version.__version__"}
